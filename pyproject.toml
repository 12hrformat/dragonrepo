[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragonrepo"
version = "1.0.0"
description = "Automated penetration testing report generator with command tracking and evidence."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "typer>=0.9",
    "rich>=13",
    "jinja2>=3",
    "markdown>=3"
]

[project.scripts]
dragonrepo = "dragonrepo.cli:app"

[tool.setuptools.packages.find]
include = ["dragonrepo*"]

[tool.setuptools.package-data]
dragonrepo = [
    "templates/*.j2"
]
